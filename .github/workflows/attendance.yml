name: Auto Attendance

on:
  schedule:
    - cron: '30 3 * * 1-6'    # 9:00 AM IST  (UTC is IST - 5:30, so 3:30 UTC)
    - cron: '30 12 * * 1-6'   # 6:00 PM IST  (12:30 UTC)
  workflow_dispatch:            # manual trigger from GitHub UI

jobs:
  punch-in:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 3 * * 1-6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Submit punch-in
        env:
          FORM_NAME:    ${{ secrets.FORM_NAME }}
          FORM_TOKEN:   ${{ secrets.FORM_TOKEN }}
          FORM_MESSAGE: ${{ secrets.FORM_MESSAGE }}
        run: python punch_in.py

  punch-out:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 12 * * 1-6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Submit punch-out
        env:
          FORM_NAME:  ${{ secrets.FORM_NAME }}
          FORM_TOKEN: ${{ secrets.FORM_TOKEN }}
        run: python punch_out.py